<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Pilih Dosen</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
  <div class="container">
    <h2 class="mb-4">📚 Pilih Dosen Institut Asia Malang</h2>

    <form method="get" action="/">
      <select name="id" class="form-select" required>
        <option value="">-- Pilih Dosen --</option>
        {% for d in dosen_list %}
          <option value="{{ d.id }}">{{ d.nama }}</option>
        {% endfor %}
      </select>

      <button type="submit" class="btn btn-primary mt-3">Tampilkan Profil</button>
    </form>
  </div>
</body>
</html>
