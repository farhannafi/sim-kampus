{% extends 'app/base.html' %}

{% block content %}
<div class="container mt-4" style="max-width: 600px;">
    <div class="card shadow">
        <div class="card-header bg-warning text-dark fw-bold">
            <i class="fa-solid fa-pen-to-square me-2"></i> Edit Data Dosen
        </div>
        <div class="card-body">
            <form method="POST">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label class="form-label fw-bold">Nama Lengkap</label>
                    {{ form.nama }}
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">ID Google Scholar</label>
                    {{ form.author_id }}
                    <div class="form-text text-danger">
                        <i class="fa-solid fa-triangle-exclamation"></i> 
                        Hati-hati mengubah ID! Data lama akan dipindahkan ke ID baru.
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Fakultas</label>
                    {{ form.fakultas }}
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary fw-bold w-100">
                        <i class="fa-solid fa-save me-2"></i> SIMPAN PERUBAHAN
                    </button>
                    <a href="{% url 'kelola_dosen' %}" class="btn btn-secondary w-100">Batal</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
